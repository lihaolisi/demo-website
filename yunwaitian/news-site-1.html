      <h1 class="article-title">两轮停放点现场勘查完成</h1>
      <div class="article-meta">发布日期：2026-06-25　　来源：山东云外天信息科技有限公司</div>
      <figure class="story-cover">
        <img src="assets/img/news/survey.jpg" alt="两轮停放点现场勘查">
        <figcaption>济南相关场站两轮停放点勘查现场</figcaption>
      </figure>
      <div class="article-body">
        <p>近日，我们对济南静态交通相关场站的两轮集中停放点做了现场勘查，核对点位、供电条件和网络覆盖，为后续充电柜安装和联网做准备。</p>
        <ul class="story-checklist">
          <li>柜子能不能落地：看地面承重、通道宽度和雨棚净空。</li>
          <li>电能不能供上：核对配电箱容量、回路和就近取电距离。</li>
          <li>信号稳不稳：插卡试网，登记弱信号点位以便后续调整。</li>
        </ul>
        <p>条件不足的点位已登记，现场记录将作为设备到货和开通的依据，不在此重复公开。</p>
      </div>
