<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 - 山东云外天信息科技有限公司</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" data-active="contact"></header>

  <div class="page-hero has-photo" style="--page-img: url('assets/img/building-wide.jpg')">
    <div class="wrap">
      <h2>联系我们</h2>
      <p>我们在济南。业务沟通、设备配套，欢迎来电或留言。</p>
    </div>
  </div>

  <section class="sec white">
    <div class="wrap">
      <div class="people">
        <div class="person">
          <b>邓瑞瑞</b>
          <em>商务联系</em>
          <p>15621850333</p>
        </div>
        <div class="person">
          <b>孟令一</b>
          <em>设备事务</em>
          <p>18866892292</p>
        </div>
      </div>
      <div class="form-box">
        <form class="form" id="contactForm">
          <div class="row"><label>姓名</label><input type="text" required></div>
          <div class="row"><label>电话</label><input type="tel" required></div>
          <div class="row"><label>留言</label><textarea required></textarea></div>
          <button class="btn btn-navy" type="submit">提交</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="copyright" style="border:0">版权所有 © <span id="year">2026</span> 山东云外天信息科技有限公司</div>
  </footer>
