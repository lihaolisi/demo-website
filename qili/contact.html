<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-left"><span>欢迎访问河南启力高科有限公司官网</span></div>
      <div class="topbar-right"><a href="contact.html">联系我们</a></div>
    </div>
  </div>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="assets/img/logo.svg" alt="启力高科">
        <div>
          <h1>河南启力高科有限公司</h1>
          <p>HENAN QILI HIGH-TECH CO., LTD.</p>
        </div>
      </a>
    </div>
  </header>
  <nav class="nav">
    <div class="container nav-inner">
      <a href="index.html">首页</a>
      <a href="about.html">关于我们</a>
      <a href="products.html">产品中心</a>
      <a href="news.html">新闻公告</a>
      <a class="active" href="contact.html">联系我们</a>
    </div>
  </nav>

  <div class="page-banner">
    <div class="container">
      <div class="crumb"><a href="index.html">首页</a> / 联系我们</div>
      <h2>联系我们</h2>
    </div>
  </div>

  <section class="section">
    <div class="container contact-grid">
      <div class="about-card">
        <h3>在线留言</h3>
        <form class="form" id="contactForm">
          <div class="row">
            <label>姓名</label>
            <input type="text" name="name" required>
          </div>
          <div class="row">
            <label>电话</label>
            <input type="tel" name="phone" required>
          </div>
          <div class="row">
            <label>留言内容</label>
            <textarea name="message" required></textarea>
          </div>
          <button class="btn btn-navy" type="submit">提交留言</button>
        </form>
      </div>
      <aside class="kv">
        <h3>公司地址</h3>
        <div class="kv-row"><span>企业名称</span>河南启力高科有限公司</div>
        <div class="kv-row"><span>办公地址</span>河南自贸试验区郑州片区（经开）第十九大街西、沿河路南科技创新园 2 号办公楼</div>
        <div class="kv-row"><span>联系电话</span>0371-6668 0312</div>
        <div class="kv-row"><span>业务咨询</span>充电桩 / 储能 / 系统集成</div>
      </aside>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
